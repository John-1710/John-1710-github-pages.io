  <header>

  <main>
    <section class="card">
      <h1>Contact Me</h1>
      <p>Have a question or want to work together? Send me an email directly at <a href="mailto:hello@example.com">hello@example.com</a> or fill out the form below to open your email client.</p>

      <!-- HTML5 mailto form -->
      <form class="contact-form" action="mailto:hello@example.com" method="post" enctype="text/plain">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="Name" required placeholder="Jane Doe">
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="Email" required placeholder="jane@example.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="5" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="btn">Send Email</button>
      </form>
    </section>
  </main>

  <footer>
